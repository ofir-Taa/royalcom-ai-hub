<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סביבת מומחה | RoyalCom</title><style>body{margin:0;background:#0d192b;color:#e9f2ff;font:16px Arial}header,main{max-width:1050px;margin:auto;padding:20px}a{color:#9ec8ff}h1{font-size:30px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#192a43;border:1px solid #2d4566;border-radius:18px;padding:22px}button{background:#2778e9;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;background:#0c1a2d;color:white;border:1px solid #446080;border-radius:10px;padding:12px;font:inherit;margin:6px 0 15px}textarea{min-height:100px}.muted{color:#adc0d8}.status{background:#263b53;padding:12px;border-radius:10px}</style><header><a href="./index.html">← כל הסוכנים</a></header><main><h1 id="title"></h1><p id="subtitle" class="muted"></p><div id="cards" class="cards"></div><section class="card" style="margin-top:18px"><h2>משימה למומחה</h2><textarea id="task" placeholder="כתוב מה תרצה לעשות..."></textarea><button id="copy">העתק בקשה מקצועית</button> <a id="chat" href="#">עבור למסך השיחה</a><p class="muted">המערכת מכינה בקשה מותאמת לתחום. ביצוע אוטומטי וחיבור נתונים דורשים שרת AI מאובטח.</p></section></main><script>const configs={"איתי":{title:"איתי — מעבדת רשתות",subtitle:"בדיקת מתגים, VLAN, מצלמות, SNMP ומיפוי רשת",actions:[["בדיקת תקלה","תאר את הבעיה, כתובות IP ודגמי הציוד"],["ניתוח סריקה","הדבק תוצאות Advanced IP Scanner או נתוני מתג"],["מיפוי רשת","הכן תרשים פורטים, VLAN וציוד מחובר"]],link:"http://127.0.0.1:8080/",linkTitle:"פתח Royal Network Insight במחשב"}, "מאיה":{title:"מאיה — סטודיו נסיעות",subtitle:"טיול תאילנד בפברואר 2027 · שני זוגות · חופים, אטרקציות ומלונות נוחים",actions:[["השוואת מלונות","תאילנד 11–22 בפברואר 2027, שני זוגות, חדר עם נוף לים או לבריכה, תקציב עד 15,000 ₪ לזוג כולל הוצאות מתוכננות. השווה מלונות, ציין מקורות ומחיר בדוק"],["מסלול ואטרקציות","בנה מסלול לתאילנד עם חופים, שווקים, חיי לילה, אטרקציות ימיות, פילים בצורה אחראית ואומגות, לפי מזג אוויר עונתי"],["בדיקת הזמנות","הכן רשימת פרטים לבדיקה מול מלונות וחברות תעופה, ללא הנחת זמינות"]],link:"https://claude.ai/",linkTitle:"פתח Claude למחקר (ללא העברת בקשה אוטומטית)"}, "יובל":{title:"יובל — מרכז פיתוח",subtitle:"GitHub, Claude Code, סקירת קוד, בדיקות ופריסות",actions:[["סקירת פרויקט","בדוק את הפרויקט RoyalCom AI Hub: ארכיטקטורה, בדיקות, אבטחה וחוסרים"],["משימת פיתוח","נסח Issue עם קריטריוני קבלה, בדיקות ותוכנית מימוש"],["בדיקת גרסה","השווה גרסאות, בדוק שינויים והכן רשימת בדיקות לפני פריסה"]],link:"https://github.com/ofir-Taa/royalcom-ai-hub",linkTitle:"קוד הפורטל ב-GitHub"}};const name=new URLSearchParams(location.search).get("name")||"איתי",c=configs[name]||configs["איתי"];document.querySelector("#title").textContent=c.title;document.querySelector("#subtitle").textContent=c.subtitle;document.querySelector("#chat").href="./chat.html?name="+encodeURIComponent(name);const cards=document.querySelector("#cards");c.actions.forEach(([title,description])=>{const el=document.createElement("div");el.className="card";const h=document.createElement("h2");h.textContent=title;const p=document.createElement("p");p.textContent=description;const b=document.createElement("button");b.textContent="בחר משימה";b.onclick=()=>{document.querySelector("#task").value=description;document.querySelector("#task").focus()};el.append(h,p,b);cards.append(el)});const el=document.createElement("div");el.className="card";el.innerHTML='<h2>כלי העבודה</h2><p class="status">חיבור אוטומטי עדיין לא אומת</p>';const a=document.createElement("a");a.href=c.link;a.textContent=c.linkTitle;a.target="_blank";a.rel="noopener noreferrer";el.append(a);cards.append(el);document.querySelector("#copy").onclick=()=>{const v=document.querySelector("#task").value.trim();if(!v)return alert("בחר משימה או כתוב בקשה");navigator.clipboard.writeText("פעל כמומחה "+c.title+". "+v).then(()=>alert("הבקשה הועתקה"))};</script></html>
