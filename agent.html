<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סביבת סוכן | RoyalCom AI Hub</title><style>
body{margin:0;font:16px Arial;background:#eef3fa;color:#183355}main{max-width:940px;margin:auto;padding:24px}header{background:#0b2d57;color:white;padding:20px}a{color:#1364cc}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 3px 14px #0013}h1{margin:8px 0}h2{font-size:19px}button,.btn{border:0;background:#126be5;color:white;padding:12px 16px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;margin:5px}button:disabled{background:#9aa9bc}textarea{width:100%;min-height:110px;border:1px solid #c7d3e3;border-radius:10px;padding:12px;box-sizing:border-box;font:inherit}.item{border:1px solid #d9e4f3;border-radius:12px;padding:13px;margin:9px 0}small{color:#667f9f}#workspaceBanner a{background:#0a8f6e}@media(max-width:600px){main{padding:12px}}</style></head><body><header>♛ RoyalCom AI Hub — סביבת מומחה</header><main><a href="./index.html">← חזרה לכל הסוכנים</a><section class="panel"><h1 id="name"></h1><p id="role"></p><small id="status"></small><div id="workspaceBanner"></div></section><section class="panel"><h2>מה אפשר לעשות עם הסוכן?</h2><div id="actions"></div></section><section class="panel"><h2>הכן בקשה למומחה</h2><textarea id="request" placeholder="כתוב כאן מה תרצה לבצע..."></textarea><div><button id="copy">העתק בקשה</button><a class="btn" id="open" target="_blank" rel="noopener noreferrer">פתח סביבת עבודה</a><a class="btn" id="chat">💬 פתח צ'אט חי עם הסוכן</a></div><p><small>הבקשה מועתקת ללוח בלבד; אין עדיין שליחה אוטומטית לסוכן. אפשר להדביק אותה בחלון שנפתח.</small></p></section></main><script>
const data={
"רונה":{role:"ניהול אישי ועסקי, תיאום ומעקב",status:"ChatGPT מחובר בנפרד; אין שיחה משובצת בפורטל",url:"https://chatgpt.com/",tasks:["רכזי לי את המשימות הפתוחות להיום","השווי בין נתוני היומן לחשבוניות","תכנני סדר עדיפויות לעסק"]},
"שלומי":{role:"יומן עבודה ומשימות שטח",status:"GitHub Worker קיים; ממשק היומן החי טרם קושר",url:"https://github.com/ofir-Taa/Task-system",tasks:["הציגי משימות עבודה פתוחות","בדקי עבודות שהושלמו וטרם נסגרו","הכיני סיכום עבודות השבוע"]},
"דן":{role:"חשבוניות, ספקים ותשלומים",status:"SmartBI ו-Sheets עדיין לא מחוברים לפורטל",url:"https://chatgpt.com/",tasks:["בדוק יתרות ספקים מעודכנות","מצא חשבוניות אחרונות ב-SmartBI","התאם תשלומים מול כרטסות"]},
"נועה":{role:"תקשורת, Gmail ולקוחות",status:"Gmail נפתח; WhatsApp דורש חיבור",url:"https://mail.google.com/",tasks:["אתרי מיילים מלקוח","נסחי מייל מעקב ללקוח","בדקי פניות שלא נענו"]},
"איתי":{role:"רשתות, מצלמות ו-SNMP",status:"Royal Network Insight נמצא מקומית; לא פורס",url:"http://127.0.0.1:8080/",workspace:"./itai.html",tasks:["נתח בעיית VLAN","בדוק סטטוס מתגים ופורטים","הכן רשימת בדיקות לתקלה במצלמות"]},
"מאיה":{role:"מחקר, טיולים ומלונות",status:"סוכן AI טרם אומת; כלי תכנון מקומי לטיול תאילנד 2027 זמין",url:"",workspace:"./maya.html",tasks:["תכנני מסלול לטיול","השווי מלונות לפי תקציב","מצאי אטרקציות מומלצות"]},
"יובל":{role:"GitHub, Claude Code ופיתוח",status:"Task-system Worker נמצא במחשב",url:"https://github.com/ofir-Taa/Task-system",workspace:"./yuval.html",tasks:["הכן Issue לפיתוח תכונה","בדוק PR פתוחים","תכנן בדיקות לפני פריסה"]},
"הילה":{role:"תוכן, שיווק ויצירת מדיה",status:"AIModelsStudio נמצא מקומית; לא פורס",url:"",tasks:["הכן תוכנית תוכן חודשית","כתוב פוסט שיווקי","תכנן קמפיין תוכן"]},
"אלון":{role:"בית חכם ו-Home Assistant",status:"Worker מתוזמן קיים; ממשק טרם חובר",url:"",tasks:["נתח תקלה באוטומציה","תכנן תרחיש לבית חכם","בדוק הגדרות של חיישן"]}
};const name=new URLSearchParams(location.search).get('name')||'רונה',a=data[name]||data["רונה"];document.getElementById('name').textContent=name;document.getElementById('role').textContent=a.role;document.getElementById('status').textContent=a.status;if(a.workspace){const wb=document.getElementById('workspaceBanner');const wa=document.createElement('a');wa.className='btn';wa.textContent='🧭 פתח סביבת עבודה ייעודית ל-'+name;wa.href=a.workspace;wb.append(wa)}const actions=document.getElementById('actions');a.tasks.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>document.getElementById('request').value=t;actions.append(b)});const link=document.getElementById('open');if(a.url)link.href=a.url;else{link.removeAttribute('href');link.textContent='ממשק חיצוני עדיין לא מחובר';link.style.background='#8799b2';link.style.pointerEvents='none'}document.getElementById('chat').href='./chat.html?name='+encodeURIComponent(name);document.getElementById('copy').onclick=()=>{const t=document.getElementById('request').value;if(!t)return alert('כתוב בקשה תחילה');navigator.clipboard.writeText(t).then(()=>alert('הבקשה הועתקה')).catch(()=>alert('לא ניתן להעתיק בדפדפן הזה'))};</script></body></html>
